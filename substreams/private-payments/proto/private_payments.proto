syntax = "proto3";
package null.payments.v1;

message PaymentEvents { repeated PublicPaymentEvent events = 1; }
message PublicPaymentEvent {
  string protocol = 1;
  uint64 chain_id = 2;
  uint64 block_number = 3;
  bytes block_hash = 4;
  bytes transaction_hash = 5;
  uint32 log_index = 6;
  bytes emitter = 7;
  oneof payload {
    Envelope envelope = 10;
    Distribution distribution = 11;
    Consumption consumption = 12;
    Note note = 13;
  }
}
message Envelope {
  bytes transport_tag = 1;
  uint32 slot = 2;
  uint32 version = 3;
  bytes scheme_id = 4;
  bytes ephemeral_pub_key = 5;
  bytes view_tag = 6;
  bytes ciphertext = 7;
}
message Distribution {
  bytes commitment = 1;
  bytes envelope_root = 2;
  bytes transport_tag = 3;
  bytes leaf_index = 4;
  bytes post_distribution_root = 5;
  uint32 version = 6;
  uint32 slot_count = 7;
}
message Consumption {
  bytes nullifier = 1;
  bytes output_commitment = 2;
  bytes note_index = 3;
  bytes post_note_root = 4;
  uint32 version = 5;
}
message Note {
  bytes commitment = 1;
  bytes note_index = 2;
  bytes post_note_root = 3;
  uint32 note_type = 4;
}
