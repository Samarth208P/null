[package]
name = "null-private-payments"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Keep the runtime aligned with entity-change 2.0 to avoid duplicate WASM alloc exports.
substreams = "=0.6.4"
substreams-ethereum = "=0.10.6"
prost = "=0.13.5"
ethabi = "=17.2.0"
hex = "=0.4.3"
anyhow = "=1.0.99"
substreams-entity-change = "=2.0.0"

[profile.release]
lto = true
opt-level = "s"
strip = "debuginfo"
