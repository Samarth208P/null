[package]
name = "null-private-payments"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
substreams = "=0.7.0"
substreams-ethereum = "=0.11.1"
prost = "=0.13.5"
ethabi = "=17.2.0"
hex = "=0.4.3"
anyhow = "=1.0.99"

[profile.release]
lto = true
opt-level = "s"
strip = "debuginfo"
