[build]
  command = "pnpm build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22.16.0"
  PNPM_VERSION = "11.9.0"

[functions]
  directory = "dist/netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/organization/*"
  to = "/.netlify/functions/organization/api/organization/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
